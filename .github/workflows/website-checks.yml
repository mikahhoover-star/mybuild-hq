name: Website checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
      - run: node scripts/security-regression.mjs
